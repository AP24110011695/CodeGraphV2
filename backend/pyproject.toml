[project]
name = "codegraph-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "celery",
    "structlog",
    "httpx",
    "pgvector",
    "python-multipart",
    "python-slugify",
    "pathspec>=1.1.1",
    "pygments>=2.20.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "slowapi>=0.1.10",
    "prometheus-fastapi-instrumentator>=8,<9",
    "openai>=3.2.0",
    "anthropic>=0.122.0",
    "groq>=1.6.0",
    "networkx>=3.6.1",
    "tiktoken>=0.14.0",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
]




[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
]


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/*" = ["B008"]


[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "e2e: requires a running Docker Compose stack and configured external providers",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "types-pygments>=2.20.0.20260728",
]
