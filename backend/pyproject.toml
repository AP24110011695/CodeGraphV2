[project]
name = "codegraph-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "celery",
    "structlog",
    "httpx",
    "pgvector",
    "python-multipart",
    "python-slugify",
]




[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
]


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/*" = ["B008"]


[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

